name: Build Shizuku Debug APK

on:
  workflow_dispatch:

jobs:
  build-shizuku-debug:
    name: Compilar APK Debug con Shizuku y Diagnóstico
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Sin caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar firma Debug incondicionalmente (Script Shell)
        run: bash .github/scripts/setup_debug_keystore.sh

      - name: Forzar descarga e inyección de dependencias Shizuku (API + Provider)
        run: bash .github/scripts/setup_shizuku_deps.sh

      - name: Inyectar y verificar herramientas de depuración (LeakCanary y Logcat Viewer)
        run: bash .github/scripts/setup_debug_tools.sh

      - name: Preparar Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generando gradlew wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK Debug con Shizuku integrado
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Subir APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-shizuku-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
