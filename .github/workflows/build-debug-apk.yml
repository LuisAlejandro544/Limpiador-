name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Sin caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Caché desactivada expresamente
          cache: ''

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar firma Debug (debug.keystore)
        run: |
          echo "Verificando y preparando debug.keystore en la raíz..."
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore.base64 a debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generando nuevo debug.keystore en la raíz del proyecto..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true

      - name: Preparar Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Inicializando wrapper de Gradle..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK Debug (Sin caché)
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Subir APK Debug generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
